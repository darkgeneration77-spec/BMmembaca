<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bacaan Bahasa Melayu</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#18251e;font-family:system-ui,sans-serif}.app{max-width:850px;margin:auto;padding:16px}.storycover{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fff9eb,#f5e7c8);border:1px solid #ead9b4;padding:23px 24px 18px;text-align:center;margin:10px auto 14px}.storycover:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#f4c96e;right:7%;top:-70px;opacity:.55}.eyebrow{font-size:12px;letter-spacing:.15em;color:#76603b}h1{font: bold 29px Georgia,serif;color:#334b36;position:relative;margin:8px}.sub{font-size:13px;color:#6d715b}.savanna{height:48px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,transparent 50%,#d5c28f 51%);position:relative}.savanna:before{content:'';position:absolute;bottom:14px;left:10%;width:55px;height:30px;border-radius:80% 30% 50% 20%;background:#8e9470;box-shadow:85px 8px 0 -7px #8e9470,175px 4px 0 -6px #8e9470,285px 7px 0 -7px #8e9470}.controls{position:sticky;top:0;z-index:4;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 6px;background:#ffffffed;backdrop-filter:blur(12px)}button,select{border:1px solid #b4cbbb;background:#f2f7f3;color:#183b28;border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer}.primary{background:#31a873;border-color:#31a873;color:white;font-weight:700}label{font-size:14px;color:#294b36}.lyrics{height:min(76vh,790px);overflow-y:auto;padding:22vh 12px 30vh;scrollbar-width:thin}.lyric{color:#20392b;margin:0 auto 26px;max-width:730px;text-align:center;line-height:1.55;cursor:pointer}.lyric.current{background:#eef8ef;border:2px solid #65a879;border-radius:18px;padding:12px 4px}.linechars{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:10px 7px}.char{display:inline-flex;flex-direction:column;align-items:center;border-radius:7px;padding:2px 3px;cursor:pointer}.py{font-size:12px;color:#496a53;min-height:25px}.hz{font:32px Georgia,serif}.hidepy .py{display:none}.char.lit{background:#ffb900;outline:2px solid #d97706;transform:scale(1.09)}.char.past{background:#a8e6b5;color:#14532d}.chapter{display:flex;align-items:center;gap:12px;color:#60735e;font-size:13px;margin:35px auto 22px}.chapter:before,.chapter:after{content:'';height:1px;flex:1;background:#d8e4d6}.status,.readingmode{text-align:center;font-size:13px;color:#496451;margin:8px}.position{text-align:center;background:#fff5cc;color:#754600;padding:8px;border-radius:8px;font-size:20px;font-weight:bold}.progress{height:4px;background:#e4eee7;border-radius:10px;overflow:hidden;margin:7px 0}.progress div{height:100%;background:#75d5a0;width:0}@media(max-width:500px){.app{padding:7px}.controls{gap:5px}button,select{padding:9px}.hz{font-size:27px}}.vnav{display:flex;justify-content:center;gap:8px;margin:14px 0}.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.vcard{border:1px solid #b4cbbb;border-radius:16px;padding:16px;background:#f5f9f4}.vword{font-size:25px;font-weight:700;color:#183b28}.vmeaning{font-size:20px;margin:8px 0}.vmeta{font-size:13px;color:#496a53}.vcard p{line-height:1.6}.vcard button{float:right}.vcard.playing{outline:2px solid #d97706;background:#fff5cc}[hidden]{display:none!important}.qbox{max-width:650px;margin:18px auto;padding:20px;border:1px solid #b4cbbb;border-radius:18px;background:#f5f9f4}.qopts{display:grid;gap:10px;margin:18px 0}.qopts button{font-size:19px;text-align:left;padding:15px}.qopts .correct{background:#b8eac6;border-color:#31975f}.qopts .wrong{background:#fbd7d7;border-color:#c55}.qhead{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.qprompt{font-size:24px;line-height:1.6}.qfeedback{min-height:48px;line-height:1.6}.qscore{font-size:38px;font-weight:bold;color:#28764b}.passage{background:#fff9eb;border:1px solid #ead9b4;border-radius:16px;padding:16px;margin:12px 0;font-size:19px;line-height:1.8}.passage p{margin:8px 0;cursor:pointer;border-radius:8px;padding:5px}.passage p.active{background:#ffedaa}.passage p.evidence{outline:2px solid #65a879}.comptag{color:#496a53;font-size:14px}.vnav{flex-wrap:wrap}.dictinput{width:100%;font:22px system-ui;padding:14px;border:1px solid #b4cbbb;border-radius:12px;box-sizing:border-box;margin:12px 0}.dictinput:focus{outline:2px solid #31a873}.dictinput:disabled{opacity:1;color:#20392b}.dbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}</style><main class="app"><div class="storycover"><div class="eyebrow">BACAAN BERPANDU · 有声阅读</div><h1 id="title"></h1><p class="sub">Dengar, baca dan fahami · 听读与理解</p><div class="savanna"></div></div><div style="text-align:center"><label>Tahun 年级 <select id="grade"><option>4</option><option>5</option><option>6</option></select></label> <label>Petikan 课文 <select id="lesson"></select></label></div><nav class="vnav"><button id="readTab" class="primary">Membaca 阅读</button><button id="vocabTab">Kosa Kata 词汇</button><button id="quizTab">Latihan 挑战</button><button id="compTab">Pemahaman 理解</button><button id="dictTab">Imlak 听写</button></nav><div class="controls"><button id="play" class="primary">▶ Baca 从头朗读</button><button id="pause">⏸ Jeda 暂停</button><button id="repeat">↻ Ulang 重听</button><label>Kelajuan 语速 <select id="speed"><option value=".75">Perlahan 慢速</option><option value=".85" selected>Ikut 跟读</option><option value="1">Normal 正常</option></select></label><label><input id="showpy" type="checkbox" checked> Suku kata 音节</label><label><input id="follow" type="checkbox"> Jeda 3 saat 跟读停顿</label></div><div class="readingmode">● Bacaan interaktif · 自动追踪文字</div><div class="status" id="status"></div><div class="position" id="position">Pilih bacaan 请选择朗读</div><div class="progress"><div id="progress"></div></div><section class="lyrics" id="lyrics"></section><section id="vocabPanel" hidden><h2>Kosa Kata · 重点词汇</h2><div class="vgrid" id="vocabGrid"></div><p id="vocabStatus" role="status"></p></section><section id="quizPanel" hidden><div class="qhead"><button data-mode="meaning">Maksud 词义</button><button data-mode="blank">Isi tempat kosong 填空</button><button data-mode="listen">Dengar 听音</button></div><div class="qbox" id="quizBox"></div></section><section id="compPanel" hidden><h2>Pemahaman · 阅读理解</h2><div class="passage" id="compPassage"></div><div class="qbox" id="compBox"></div></section><section id="dictPanel" hidden><h2>Mendengar dan Imlak · 听力与听写</h2><div class="qhead"><button data-dmode="word">Perkataan 单词</button><button data-dmode="sentence">Ayat 句子</button><button data-dmode="blank">Isi tempat kosong 填空</button><button data-dmode="comp">Pemahaman 听力理解</button></div><div id="dictBox" class="qbox"></div></section><audio id="audio"></audio></main><script>
const $=id=>document.getElementById(id);const lessons={4:{title:'Keluarga Saya',rows:['Sa-ya ting-gal ber-sa-ma ke-lu-ar-ga sa-ya.','I-bu me-nye-di-a-kan sa-ra-pan pa-da wak-tu pa-gi.','Ka-mi mem-ban-tu a-yah me-ngi-mas ru-mah.','Ka-mi hi-dup ru-kun dan ba-ha-gi-a.']},5:{title:'Amalan Hidup Sihat',rows:['A-ma-lan hi-dup si-hat a-mat pen-ting da-lam ke-hi-du-pan ki-ta.','Ki-ta hen-dak-lah ma-kan ma-ka-nan yang ber-kha-si-at.','Se-lain i-tu, ki-ta per-lu ber-se-nam se-ti-ap ha-ri.','Ti-dur yang men-cu-ku-pi mem-ban-tu ba-dan ki-ta ke-kal si-hat.']},6:{title:'Menjaga Alam Sekitar',rows:['A-lam se-ki-tar me-ru-pa-kan a-nu-ge-rah yang per-lu ki-ta pe-li-ha-ra.','Ki-ta bo-leh me-ngu-rang-kan si-sa de-ngan me-nga-mal-kan ki-tar se-mu-la.','Ma-sya-ra-kat hen-dak-lah be-ker-ja-sa-ma un-tuk men-ja-ga ke-ber-si-han ka-wa-san ke-di-a-man.','U-sa-ha i-ni da-pat men-ja-min ke-se-jah-te-ra-an ge-ne-ra-si a-kan da-tang.']}};let data=[],idx=0,active=-1,token=0,timer=null,paused=false,utterance=null;const audio=$('audio');function stop(){token++;clearTimeout(timer);audio.pause();window.speechSynthesis?.cancel();paused=false;$('pause').textContent='⏸ Jeda 暂停'}function load(){stop();const l=lessons[$('grade').value];$('title').textContent=l.title;$('lesson').replaceChildren(new Option(l.title,'1'));data=l.rows.map(r=>r.split(' ').map(py=>({py:py.replace(/[,.]/g,''),word:py.replaceAll('-','')})));$('lyrics').replaceChildren();data.forEach((words,i)=>{if(i%2===0){const p=document.createElement('div');p.className='chapter';p.textContent='Perenggan '+(i/2+1)+' · 第'+(i/2+1)+'段';$('lyrics').append(p)}const line=document.createElement('div');line.className='lyric';const row=document.createElement('div');row.className='linechars';words.forEach((w,j)=>{const b=document.createElement('span');b.className='char';const p=document.createElement('span');p.className='py';p.textContent=w.py;const h=document.createElement('span');h.className='hz';h.textContent=w.word;b.append(p,h);b.onclick=e=>{e.stopPropagation();speak(i,false,j)};row.append(b)});line.append(row);line.onclick=()=>speak(i,true);$('lyrics').append(line)});mark(0,-1,false);$('lyrics').scrollTop=0;$('status').textContent='Sedia · 可以开始朗读'}function mark(i,j,scroll=true){idx=i;active=j;const lines=[...document.querySelectorAll('.lyric')];lines.forEach((l,n)=>{l.classList.toggle('current',n===i);[...l.querySelectorAll('.char')].forEach((c,k)=>{c.classList.toggle('lit',n===i&&k===j);c.classList.toggle('past',n===i&&k<j)})});$('position').textContent='Ayat '+(i+1)+' / '+data.length+(data[i][j]?' · '+data[i][j].word:'');$('progress').style.width=((i+Math.max(0,j)/data[i].length)/data.length*100)+'%';if(scroll){const l=lines[i],s=$('lyrics');s.scrollTo({top:Math.max(0,l.offsetTop-s.offsetTop-s.clientHeight*.35),behavior:'smooth'})}}function speak(i,keep,j){stop();const t=token;mark(i,j??0);const phrase=j===undefined?data[i].map(w=>w.word).join(' '):data[i][j].word.replace(/[,.!?]+$/,'');const rate=Number($('speed').value);function done(){if(t!==token)return;if(j===undefined)mark(i,data[i].length);if(keep&&i<data.length-1){$('status').textContent='Ikut baca · 请跟读';timer=setTimeout(()=>speak(i+1,true),$('follow').checked?3000:0)}else $('status').textContent='Selesai · 朗读结束'}function fallback(){if(t!==token)return;const voices=window.speechSynthesis?.getVoices()||[];const voice=voices.find(v=>/^ms/i.test(v.lang)&&/Yasmin/i.test(v.name))||voices.find(v=>/^ms/i.test(v.lang));if(!voice){$('status').textContent='Audio tidak tersedia · 音频尚未部署，请稍后刷新';return}const u=new SpeechSynthesisUtterance(phrase);utterance=u;u.voice=voice;u.lang=voice.lang;u.rate=rate;u.onboundary=e=>{if(t===token&&j===undefined)mark(i,phrase.slice(0,e.charIndex).trimEnd().split(/\s+/).length-(e.charIndex===0?1:0))};u.onend=done;u.onerror=()=>{$('status').textContent='Audio gagal · 朗读失败'};speechSynthesis.speak(u)}audio.src='audio/'+$('grade').value+'/'+i+(j===undefined?'':'-'+j)+'.mp3';audio.playbackRate=rate;audio.ontimeupdate=()=>{if(t===token&&j===undefined&&audio.duration>0)mark(i,Math.min(data[i].length-1,Math.floor(audio.currentTime/audio.duration*data[i].length)))};audio.onended=done;audio.play().then(()=>{if(t===token)$('status').textContent='Sedang membaca · 正在朗读'}).catch(()=>{if(t===token)fallback()});}$('grade').onchange=load;$('play').onclick=()=>speak(0,true);$('repeat').onclick=()=>speak(idx,false);$('pause').onclick=()=>{paused=!paused;if(window.speechSynthesis?.speaking){paused?speechSynthesis.pause():speechSynthesis.resume()}else if(paused){audio.pause();clearTimeout(timer)}else audio.play().catch(()=>speak(idx,true));$('pause').textContent=paused?'▶ Sambung 继续':'⏸ Jeda 暂停'};$('speed').onchange=()=>{audio.playbackRate=Number($('speed').value)};$('showpy').onchange=()=>$('lyrics').classList.toggle('hidepy',!$('showpy').checked);load();window.speechSynthesis?.getVoices();const vocabulary={"4":[["tinggal","居住","Kata kerja","Saya tinggal di Pulau Pinang."],["bersama","一起","Kata tugas","Saya makan bersama ibu."],["keluarga","家庭","Kata nama","Saya sayang akan keluarga saya."],["menyediakan","准备","Kata kerja","Ibu menyediakan makanan."],["sarapan","早餐","Kata nama","Kami menikmati sarapan."],["membantu","帮助","Kata kerja","Ali membantu ibunya."],["mengemas","收拾","Kata kerja","Adik mengemas bilik."],["rukun","和睦","Kata adjektif","Kami hidup rukun."],["bahagia","幸福","Kata adjektif","Keluarga kami bahagia."]],"5":[["amalan","习惯；实践","Kata nama","Membaca ialah amalan yang baik."],["sihat","健康","Kata adjektif","Badan saya sihat."],["penting","重要","Kata adjektif","Air penting untuk badan."],["kehidupan","生活","Kata nama","Air diperlukan dalam kehidupan."],["berkhasiat","有营养","Kata adjektif","Sayur-sayuran berkhasiat."],["bersenam","运动","Kata kerja","Kami bersenam di taman."],["mencukupi","足够","Kata kerja","Tidur yang mencukupi penting untuk kesihatan."],["kekal","保持","Kata adjektif","Kita perlu kekal sihat."]],"6":[["merupakan","是；属于","Kata kerja","Air merupakan sumber kehidupan."],["anugerah","恩赐","Kata nama","Alam ialah anugerah yang berharga."],["pelihara","保护","Kata kerja","Kita perlu pelihara alam sekitar."],["mengurangkan","减少","Kata kerja","Kita perlu mengurangkan sisa plastik."],["sisa","废弃物","Kata nama","Sisa makanan boleh dijadikan kompos."],["mengamalkan","实践","Kata kerja","Kami mengamalkan gaya hidup sihat."],["masyarakat","社会；民众","Kata nama","Masyarakat perlu menjaga kebersihan."],["bekerjasama","合作","Kata kerja","Kami bekerjasama membersihkan kelas."],["kebersihan","清洁","Kata nama","Kebersihan sekolah tanggungjawab bersama."],["kediaman","住所","Kata nama","Kawasan kediaman itu bersih."],["menjamin","保障","Kata kerja","Amalan sihat membantu menjamin kesejahteraan."],["kesejahteraan","福祉","Kata nama","Kita menjaga kesejahteraan masyarakat."],["generasi","世代","Kata nama","Alam perlu dijaga untuk generasi akan datang."]]};
const va=new Audio();let currentCard=null;function stopVocab(){va.pause();if(currentCard)currentCard.classList.remove('playing');currentCard=null;}
function renderVocab(){const grid=$('vocabGrid');grid.replaceChildren();for(const [word,meaning,type,example] of vocabulary[$('grade').value]||[]){let i=-1,j=-1;data.some((row,n)=>{const k=row.findIndex(w=>w.word.toLowerCase().replace(/[,.!?]+$/,'')===word);if(k<0)return false;i=n;j=k;return true});if(i<0)continue;const card=document.createElement('article');card.className='vcard';const b=document.createElement('button');b.textContent='▶';b.setAttribute('aria-label','Dengar '+word);b.onclick=()=>{stop();stopVocab();currentCard=card;va.src='audio/'+$('grade').value+'/'+i+'-'+j+'.mp3';va.playbackRate=Number($('speed').value);va.play().then(()=>{if(currentCard===card)card.classList.add('playing')}).catch(()=>{$('vocabStatus').textContent='Audio gagal · 请重试'});};card.append(b);for(const [cls,txt] of [['vword',word],['vmeta',data[i][j].py],['vmeaning',meaning],['vmeta',type],['',example]]){const el=document.createElement(cls?'div':'p');el.className=cls;el.textContent=txt;card.append(el)}grid.append(card)}}
va.onended=stopVocab;function tab(v){stop();stopVocab();$('vocabPanel').hidden=!v;for(const el of [document.querySelector('.controls'),document.querySelector('.readingmode'),$('status'),$('position'),document.querySelector('.progress'),$('lyrics')])el.hidden=v;$('readTab').classList.toggle('primary',!v);$('vocabTab').classList.toggle('primary',v);if(v)renderVocab();}
$('readTab').onclick=()=>tab(false);$('vocabTab').onclick=()=>tab(true);$('grade').onchange=()=>{stopVocab();load();if(!$('vocabPanel').hidden)renderVocab();};const quizAudio=new Audio();let mode='meaning',questions=[],missed=[],qi=0,points=0,locked=false;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function locateWord(word){for(let i=0;i<data.length;i++){const j=data[i].findIndex(w=>w.word.toLowerCase().replace(/[,.!?]+$/,'')===word);if(j>=0)return [i,j]}return null}
function pool(){return (vocabulary[$('grade').value]||[]).filter(v=>locateWord(v[0]))}
function startQuiz(items){quizAudio.pause();questions=shuffle(items||pool());missed=[];qi=0;points=0;showQuestion()}
function el(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n}
function showQuestion(){quizAudio.pause();locked=false;const box=$('quizBox');box.replaceChildren();if(qi>=questions.length){const pct=questions.length?Math.round(points/questions.length*100):0;box.append(el('h2',pct>=80?'Lulus · 通关成功':'Cuba lagi · 继续练习'),el('div',pct+'%','qscore'),el('p',points+' / '+questions.length+' betul · 答对'));try{localStorage.setItem('bmquiz:'+ $('grade').value+':'+mode,JSON.stringify({points,total:questions.length,pct,date:new Date().toISOString()}))}catch{}if(missed.length){const retry=el('button','Ulang kesalahan 错题重练');retry.onclick=()=>startQuiz(missed);box.append(retry)}const again=el('button','Mula semula 重新挑战');again.onclick=()=>startQuiz();box.append(again);return}
const v=questions[qi], [word,meaning,type,example]=v;box.append(el('p','Soalan '+(qi+1)+' / '+questions.length+' · '+points+' betul'));
let prompt=mode==='meaning'?word:mode==='blank'?example.replace(new RegExp('\\b'+word+'\\b','gi'),'________'):'Dengar dan pilih · 听音选词';box.append(el('div',prompt,'qprompt'));
if(mode==='listen'){const b=el('button','▶ Dengar 听发音');b.onclick=()=>{const [i,j]=locateWord(word);quizAudio.src='audio/'+$('grade').value+'/'+i+'-'+j+'.mp3';quizAudio.playbackRate=Number($('speed').value);quizAudio.play().catch(()=>{feedback.textContent='Audio gagal · 请重试'})};box.append(b)}
const col=mode==='meaning'?1:0;const answer=v[col];const options=shuffle([answer,...shuffle([...new Set(pool().map(x=>x[col]).filter(x=>x!==answer))]).slice(0,3)]);const opts=el('div','','qopts'),feedback=el('div','','qfeedback');for(const opt of options){const b=el('button',opt);b.onclick=()=>{if(locked)return;locked=true;quizAudio.pause();const ok=opt===answer;if(ok)points++;else missed.push(v);for(const btn of opts.children){btn.disabled=true;if(btn.textContent===answer)btn.classList.add('correct')}if(!ok)b.classList.add('wrong');feedback.textContent=(ok?'Betul! 正确！':'Jawapan 正确答案：'+answer)+' · '+word+'（'+meaning+'） · '+example;next.hidden=false};opts.append(b)}box.append(opts,feedback);const next=el('button','Seterusnya 下一题','primary');next.hidden=true;next.onclick=()=>{qi++;showQuestion()};box.append(next)}
