<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bacaan Bahasa Melayu</title><style>*{box-sizing:border-box}body{margin:0;background:white;color:#18251e;font-family:system-ui,sans-serif}.app{max-width:850px;margin:auto;padding:16px}.storycover{position:relative;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#fff9eb,#f5e7c8);border:1px solid #ead9b4;padding:23px 24px 18px;text-align:center;margin:10px auto 14px}.storycover:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:#f4c96e;right:7%;top:-70px;opacity:.55}.eyebrow{font-size:12px;letter-spacing:.15em;color:#76603b}h1{font: bold 29px Georgia,serif;color:#334b36;position:relative;margin:8px}.sub{font-size:13px;color:#6d715b}.savanna{height:48px;border-radius:0 0 12px 12px;background:linear-gradient(180deg,transparent 50%,#d5c28f 51%);position:relative}.savanna:before{content:'';position:absolute;bottom:14px;left:10%;width:55px;height:30px;border-radius:80% 30% 50% 20%;background:#8e9470;box-shadow:85px 8px 0 -7px #8e9470,175px 4px 0 -6px #8e9470,285px 7px 0 -7px #8e9470}.controls{position:sticky;top:0;z-index:4;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:13px 6px;background:#ffffffed;backdrop-filter:blur(12px)}button,select{border:1px solid #b4cbbb;background:#f2f7f3;color:#183b28;border-radius:11px;padding:10px 14px;font-size:15px;cursor:pointer}.primary{background:#31a873;border-color:#31a873;color:white;font-weight:700}label{font-size:14px;color:#294b36}.lyrics{height:min(76vh,790px);overflow-y:auto;padding:22vh 12px 30vh;scrollbar-width:thin}.lyric{color:#20392b;margin:0 auto 26px;max-width:730px;text-align:center;line-height:1.55;cursor:pointer}.lyric.current{background:#eef8ef;border:2px solid #65a879;border-radius:18px;padding:12px 4px}.linechars{display:flex;flex-wrap:wrap;justify-content:center;align-items:end;gap:10px 7px}.char{display:inline-flex;flex-direction:column;align-items:center;border-radius:7px;padding:2px 3px;cursor:pointer}.py{font-size:12px;color:#496a53;min-height:25px}.hz{font:32px Georgia,serif}.hidepy .py{display:none}.char.lit{background:#ffb900;outline:2px solid #d97706;transform:scale(1.09)}.char.past{background:#a8e6b5;color:#14532d}.chapter{display:flex;align-items:center;gap:12px;color:#60735e;font-size:13px;margin:35px auto 22px}.chapter:before,.chapter:after{content:'';height:1px;flex:1;background:#d8e4d6}.status,.readingmode{text-align:center;font-size:13px;color:#496451;margin:8px}.position{text-align:center;background:#fff5cc;color:#754600;padding:8px;border-radius:8px;font-size:20px;font-weight:bold}.progress{height:4px;background:#e4eee7;border-radius:10px;overflow:hidden;margin:7px 0}.progress div{height:100%;background:#75d5a0;width:0}@media(max-width:500px){.app{padding:7px}.controls{gap:5px}button,select{padding:9px}.hz{font-size:27px}}</style><main class="app"><div class="storycover"><div class="eyebrow">BACAAN BERPANDU · 有声阅读</div><h1 id="title"></h1><p class="sub">Dengar, baca dan fahami · 听读与理解</p><div class="savanna"></div></div><div style="text-align:center"><label>Tahun 年级 <select id="grade"><option>4</option><option>5</option><option>6</option></select></label> <label>Petikan 课文 <select id="lesson"></select></label></div><div class="controls"><button id="play" class="primary">▶ Baca 从头朗读</button><button id="pause">⏸ Jeda 暂停</button><button id="repeat">↻ Ulang 重听</button><label>Kelajuan 语速 <select id="speed"><option value=".75">Perlahan 慢速</option><option value=".85" selected>Ikut 跟读</option><option value="1">Normal 正常</option></select></label><label><input id="showpy" type="checkbox" checked> Suku kata 音节</label><label><input id="follow" type="checkbox"> Jeda 3 saat 跟读停顿</label></div><div class="readingmode">● Bacaan interaktif · 自动追踪文字</div><div class="status" id="status"></div><div class="position" id="position">Pilih bacaan 请选择朗读</div><div class="progress"><div id="progress"></div></div><section class="lyrics" id="lyrics"></section><audio id="audio"></audio></main><script>
const $=id=>document.getElementById(id);const lessons={4:{title:'Keluarga Saya',rows:['Sa-ya ting-gal ber-sa-ma ke-lu-ar-ga sa-ya.','I-bu me-nye-di-a-kan sa-ra-pan pa-da wak-tu pa-gi.','Ka-mi mem-ban-tu a-yah me-ngi-mas ru-mah.','Ka-mi hi-dup ru-kun dan ba-ha-gi-a.']},5:{title:'Amalan Hidup Sihat',rows:['A-ma-lan hi-dup si-hat a-mat pen-ting da-lam ke-hi-du-pan ki-ta.','Ki-ta hen-dak-lah ma-kan ma-ka-nan yang ber-kha-si-at.','Se-lain i-tu, ki-ta per-lu ber-se-nam se-ti-ap ha-ri.','Ti-dur yang men-cu-ku-pi mem-ban-tu ba-dan ki-ta ke-kal si-hat.']},6:{title:'Menjaga Alam Sekitar',rows:['A-lam se-ki-tar me-ru-pa-kan a-nu-ge-rah yang per-lu ki-ta pe-li-ha-ra.','Ki-ta bo-leh me-ngu-rang-kan si-sa de-ngan me-nga-mal-kan ki-tar se-mu-la.','Ma-sya-ra-kat hen-dak-lah be-ker-ja-sa-ma un-tuk men-ja-ga ke-ber-si-han ka-wa-san ke-di-a-man.','U-sa-ha i-ni da-pat men-ja-min ke-se-jah-te-ra-an ge-ne-ra-si a-kan da-tang.']}};let data=[],idx=0,active=-1,token=0,timer=null,paused=false,utterance=null;const audio=$('audio');function stop(){token++;clearTimeout(timer);audio.pause();window.speechSynthesis?.cancel();paused=false;$('pause').textContent='⏸ Jeda 暂停'}function load(){stop();const l=lessons[$('grade').value];$('title').textContent=l.title;$('lesson').replaceChildren(new Option(l.title,'1'));data=l.rows.map(r=>r.split(' ').map(py=>({py:py.replace(/[,.]/g,''),word:py.replaceAll('-','')})));$('lyrics').replaceChildren();data.forEach((words,i)=>{if(i%2===0){const p=document.createElement('div');p.className='chapter';p.textContent='Perenggan '+(i/2+1)+' · 第'+(i/2+1)+'段';$('lyrics').append(p)}const line=document.createElement('div');line.className='lyric';const row=document.createElement('div');row.className='linechars';words.forEach((w,j)=>{const b=document.createElement('span');b.className='char';const p=document.createElement('span');p.className='py';p.textContent=w.py;const h=document.createElement('span');h.className='hz';h.textContent=w.word;b.append(p,h);b.onclick=e=>{e.stopPropagation();speak(i,false,j)};row.append(b)});line.append(row);line.onclick=()=>speak(i,true);$('lyrics').append(line)});mark(0,-1,false);$('lyrics').scrollTop=0;$('status').textContent='Sedia · 可以开始朗读'}function mark(i,j,scroll=true){idx=i;active=j;const lines=[...document.querySelectorAll('.lyric')];lines.forEach((l,n)=>{l.classList.toggle('current',n===i);[...l.querySelectorAll('.char')].forEach((c,k)=>{c.classList.toggle('lit',n===i&&k===j);c.classList.toggle('past',n===i&&k<j)})});$('position').textContent='Ayat '+(i+1)+' / '+data.length+(data[i][j]?' · '+data[i][j].word:'');$('progress').style.width=((i+Math.max(0,j)/data[i].length)/data.length*100)+'%';if(scroll){const l=lines[i],s=$('lyrics');s.scrollTo({top:Math.max(0,l.offsetTop-s.offsetTop-s.clientHeight*.35),behavior:'smooth'})}}function speak(i,keep,j){stop();const t=token;mark(i,j??0);const phrase=j===undefined?data[i].map(w=>w.word).join(' '):data[i][j].word;const rate=Number($('speed').value);function done(){if(t!==token)return;if(j===undefined)mark(i,data[i].length);if(keep&&i<data.length-1){$('status').textContent='Ikut baca · 请跟读';timer=setTimeout(()=>speak(i+1,true),$('follow').checked?3000:0)}else $('status').textContent='Selesai · 朗读结束'}function fallback(){if(t!==token)return;const voice=window.speechSynthesis?.getVoices().find(v=>/^ms/i.test(v.lang));if(!voice){$('status').textContent='Audio tidak tersedia · Google 音频未加载，设备也没有马来文语音';return}const u=new SpeechSynthesisUtterance(phrase);utterance=u;u.voice=voice;u.lang=voice.lang;u.rate=rate;u.onboundary=e=>{if(t===token&&j===undefined)mark(i,phrase.slice(0,e.charIndex).trimEnd().split(/\s+/).length-(e.charIndex===0?1:0))};u.onend=done;u.onerror=()=>{$('status').textContent='Audio gagal · 朗读失败'};speechSynthesis.speak(u)}audio.src='https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ms&q='+encodeURIComponent(phrase);audio.playbackRate=rate;audio.ontimeupdate=()=>{if(t===token&&j===undefined&&audio.duration>0)mark(i,Math.min(data[i].length-1,Math.floor(audio.currentTime/audio.duration*data[i].length)))};audio.onended=done;audio.play().catch(fallback);$('status').textContent='Sedang membaca · 正在朗读'}$('grade').onchange=load;$('play').onclick=()=>speak(0,true);$('repeat').onclick=()=>speak(idx,false);$('pause').onclick=()=>{paused=!paused;if(window.speechSynthesis?.speaking){paused?speechSynthesis.pause():speechSynthesis.resume()}else if(paused){audio.pause();clearTimeout(timer)}else audio.play().catch(()=>speak(idx,true));$('pause').textContent=paused?'▶ Sambung 继续':'⏸ Jeda 暂停'};$('speed').onchange=()=>{audio.playbackRate=Number($('speed').value)};$('showpy').onchange=()=>$('lyrics').classList.toggle('hidepy',!$('showpy').checked);load();window.speechSynthesis?.getVoices();</script></html>
